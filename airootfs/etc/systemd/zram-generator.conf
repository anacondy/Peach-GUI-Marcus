# /etc/systemd/zram-generator.conf
#
# packages.x86_64 installs zram-generator, but the package alone does not create
# a zram device — the generator is a systemd generator that only acts if a
# config file exists. Shipping this file makes the behaviour explicit and
# reproducible instead of depending on whatever default the installed package
# version happens to carry (which has changed between releases).
#
# This matters for a live ISO specifically: the root filesystem is a squashfs
# with a tmpfs overlay, so memory pressure arrives much sooner than on an
# installed system. zram buys back roughly 2-3x its size in effective memory
# for a fraction of the CPU that real swap costs.
#
# Verify after boot with:  zramctl  &&  swapon --show

[zram0]
# Size the device to 100% of RAM, capped at 8 GiB. Beyond that the compression
# overhead stops paying for itself.
zram-size = min(ram, 8192)
compression-algorithm = zstd
swap-priority = 100
fs-type = swap
